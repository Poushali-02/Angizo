[project]
name = "neurocode-backend"
version = "0.1.0"
description = "NeuroCode Backend - AI Accessibility Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "langgraph>=0.0.65",
    "langchain-core>=0.2.10",
    "GitPython>=3.1.43",
    "nest-asyncio>=1.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "agent", "tools"]
